name: Render nightly thesis
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "template/**"
      - "contrib/**"
      - "typst.toml"
      - ".github/workflows/build.yml"
  pull_request:
    types: [opened, edited, synchronize]
    paths:
      - "src/**"
      - "template/**"
      - "contrib/**"
      - "typst.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch:
jobs:
  render-paper:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:0.15.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Render templates
        run: |
          mkdir -p build/nightly
          for lang in zh en; do
            typst compile --root . --input "lang=$lang" template/thesis.typ "build/nightly/thesis-$lang.pdf"
            typst compile --root . --input "lang=$lang" contrib/main.typ "build/nightly/reference-$lang.pdf"
          done
      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: thesis
          path: build/nightly/*.pdf
          if-no-files-found: error
